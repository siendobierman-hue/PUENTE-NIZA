<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente Niza · Realidad Aumentada</title>
<script type="module" src="model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef1f4;color:#1d2330}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .tabs{display:flex;background:#dde3ea;border-radius:999px;padding:3px}
  .tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:#4a5363;cursor:pointer}
  .tabs button.on{background:#fff;color:#1a73e8;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  model-viewer{width:100%;height:calc(100% - 128px);background:linear-gradient(#fff,#e9edf1)}
  .ar-btn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);border:0;border-radius:999px;
          padding:14px 26px;font-size:16px;font-weight:600;background:#1a73e8;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .bar{position:absolute;left:0;right:0;top:0;height:4px;background:#1a73e8;transform-origin:left;transition:opacity .4s}
  footer{padding:8px 16px;font-size:13px;color:#5f6673;line-height:1.4}
</style>
</head>
<body>
<header>
  <h1>Puente Niza</h1>
  <div class="tabs">
    <button id="b-entorno" class="on">Con entorno</button>
    <button id="b-estructura">Solo estructura</button>
  </div>
</header>
<model-viewer id="mv" src="puente_entorno.glb" ios-src="puente_entorno.usdz" alt="Modelo 3D del Puente Niza"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  autoplay camera-controls touch-action="pan-y" camera-orbit="35deg 60deg auto" shadow-intensity="1" exposure="1.05"
  environment-image="neutral">
  <div class="bar" slot="progress-bar" id="bar"></div>
  <button slot="ar-button" class="ar-btn">Ver en tu espacio (AR)</button>
</model-viewer>
<footer>Animación: el puente se construye por etapas y luego circulan los carros. Maqueta a escala <span id="esc">1:400</span>. Gira con un dedo y acerca con dos. Pulsa el botón azul, apunta al piso o a una mesa y pellizca para cambiar el tamaño.</footer>
<script>
  const mv = document.getElementById('mv'), bar = document.getElementById('bar');
  const set = (n) => {
    mv.src = `puente_${n}.glb`; mv.iosSrc = `puente_${n}.usdz`;
    mv.cameraOrbit = n === 'entorno' ? '35deg 60deg auto' : '20deg 72deg auto';
    document.getElementById('esc').textContent = n === 'entorno' ? '1:400' : '1:150';
    document.getElementById('b-entorno').classList.toggle('on', n === 'entorno');
    document.getElementById('b-estructura').classList.toggle('on', n === 'estructura');
  };
  document.getElementById('b-entorno').onclick = () => set('entorno');
  document.getElementById('b-estructura').onclick = () => set('estructura');
  mv.addEventListener('progress', e => { bar.style.opacity = 1; bar.style.transform = `scaleX(${e.detail.totalProgress})`;
    if (e.detail.totalProgress === 1) bar.style.opacity = 0; });
</script>
</body>
</html>
